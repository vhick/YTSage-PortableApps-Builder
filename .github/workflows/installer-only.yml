name: YTSage - Rebuild Installer from Validated ZIP
on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: 'Exact previous builder release tag containing one verified PortableApps ZIP'
        required: true
        type: string
      new_package_revision:
        description: 'New installer revision, e.g. r2 (creates a separate managed release)'
        default: r2
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: ytsage-repackage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repackage:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RELEASE: ${{ inputs.source_release_tag }}
      NEW_REV: ${{ inputs.new_package_revision }}
    steps:
      - name: Checkout only this builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Run builder regression tests
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Builder regression tests failed' }
      - name: Validate revision and release tag
        id: tag
        run: |
          python scripts/repackage.py tag
          if ($LASTEXITCODE -ne 0) { throw 'Invalid source tag or package revision' }
      - name: Download previous release assets and checksum manifest
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Path 'work/from_release' -Force | Out-Null
          gh release download "$env:SOURCE_RELEASE" --repo "$env:GH_REPO" --pattern '*.zip' --dir work/from_release
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download original validated ZIP' }
          gh release download "$env:SOURCE_RELEASE" --repo "$env:GH_REPO" --pattern 'SHA256SUMS.txt' --dir work/from_release
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download release checksum manifest' }
      - name: Verify SHA256SUMS and all source archive data
        run: |
          python scripts/repackage.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Original release ZIP validation failed' }
      - name: Reconstruct stage and revalidate before invoking installer builder
        run: |
          $zip = (Get-ChildItem -LiteralPath 'work/from_release' -Filter '*.zip' -File | Select-Object -First 1).FullName
          python scripts/validate.py inspect --zip "$zip" --dest work/repack
          if ($LASTEXITCODE -ne 0) { throw 'Original package structure/PE/hash inspection failed' }
      - name: Regenerate installer only via pinned shared Package Builder
        id: installer
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: work/repack/YTSagePortable
          output-dir: work/installer
          engine: custom-nsis
          running-exe: YTSagePortable.exe
          timeout-seconds: '900'
          package-revision: ${{ inputs.new_package_revision }}
      - name: Verify freshly generated installer
        env:
          INSTALLER_FILE: ${{ steps.installer.outputs.installer-file }}
          INSTALLER_SHA: ${{ steps.installer.outputs.installer-sha256 }}
        run: |
          ./scripts/validate_installer.ps1 -Path $env:INSTALLER_FILE -Sha256 $env:INSTALLER_SHA
      - name: Dry-run shared publisher
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: work/from_release/*.zip;work/installer/*.paf.exe
          tag: ${{ steps.tag.outputs.tag }}
          tag-prefix: portable-ytsage-
          release-title: YTSage PortableApps installer-only ${{ inputs.new_package_revision }}
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Publish verified original ZIP plus newly generated installer
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: work/from_release/*.zip;work/installer/*.paf.exe
          tag: ${{ steps.tag.outputs.tag }}
          tag-prefix: portable-ytsage-
          release-title: YTSage PortableApps installer-only ${{ inputs.new_package_revision }}
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
